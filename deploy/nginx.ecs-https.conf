server {
    listen 80;
    server_name dentstudy.uno;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dentstudy;
        try_files $uri =404;
    }
    location / { return 301 https://dentstudy.uno$request_uri; }
}

server {
    listen 443 ssl;
    server_name dentstudy.uno;
    ssl_certificate /etc/letsencrypt/live/dentstudy.uno/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dentstudy.uno/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/dentstudy-current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
