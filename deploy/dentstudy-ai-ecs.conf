EnvironmentFile=/etc/dentstudy/dentstudy-ai.env
Environment=DENTSTUDY_AI_BASE_URL=https://ws-k2360sf19dbwaa6x.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
Environment=DENTSTUDY_AI_MODEL=qwen3.7-flash
