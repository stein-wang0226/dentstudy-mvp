[Service]
# Keep the key outside this repository. The referenced file is root-only and
# contains one DENTSTUDY_AI_API_KEY=... line.
EnvironmentFile=/etc/dentstudy/dentstudy-ai.env
Environment=DENTSTUDY_AI_BASE_URL=https://ws-k2360sf19dbwaa6x.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
Environment=DENTSTUDY_AI_MODEL=qwen3.7-flash
Environment=DENTSTUDY_AI_DAILY_LIMIT=3
# ¥20 monthly service-wide guardrail. Free trial quota is used first; when it
# ends without an account balance, the provider rejects calls instead.
Environment=DENTSTUDY_AI_MONTHLY_BUDGET_FEN=2000
# 小齿聊天和题库整理分别计量；聊天不保存消息内容，只保存不可逆的
# 额度指纹、时间、token 与费用计数。以下总预算为 ¥10/月。
Environment=DENTSTUDY_ASSISTANT_DAILY_LIMIT=12
Environment=DENTSTUDY_ASSISTANT_GLOBAL_DAILY_LIMIT=300
Environment=DENTSTUDY_ASSISTANT_MONTHLY_BUDGET_FEN=1000
