name: dentstudy
description: 口腔医学间隔复习与题库学习应用
publish_to: none
version: 0.2.27+29
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.0.0
  file_picker: ^10.3.10
  timezone: ^0.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: DentStudySans
      fonts:
        - asset: assets/fonts/DentStudySans-Regular.otf
          weight: 400
        - asset: assets/fonts/DentStudySans-Bold.otf
          weight: 700
    - family: DentStudySymbols
      fonts:
        - asset: assets/fonts/DentStudySymbols-Regular.ttf
    - family: DentStudyMath
      fonts:
        - asset: assets/fonts/DentStudyMath-Regular.ttf
  assets:
    - assets/questions.json
    - assets/periodontology_questions.json
    - assets/all_questions.json
    - assets/contact_wechat.jpg
